# yt-dlp breakage is the most likely cause of a production outage for this
# product (decision D-009). Every Monday this bumps yt-dlp to latest, runs the
# live suite against real URLs, and either opens a PR with the bump or files an
# issue saying extraction is broken.
name: yt-dlp canary

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      IP_HASH_SALT: ci-salt-value-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the currently pinned version
        id: current
        run: |
          current=$(grep -oP '(?<=^yt-dlp==).*' requirements.txt)
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $current"

      - name: Resolve the latest release
        id: latest
        run: |
          latest=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json \
            | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          test -n "$latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest release: $latest"

      - name: Apply the bump
        id: bump
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          sed -i "s/^yt-dlp==.*/yt-dlp==${{ steps.latest.outputs.version }}/" requirements.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          # ffmpeg is needed to merge separate video/audio streams.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Offline first: if these fail the problem is ours, not the platform's,
      # and the live results would be uninterpretable.
      - name: Offline suite
        run: pytest -m "not live"

      - name: Live suite
        id: live
        continue-on-error: true
        run: pytest -m live -v --tb=short 2>&1 | tee /tmp/live.log

      - name: Open a bump PR
        if: steps.live.outcome == 'success' && steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Bump yt-dlp to ${{ steps.latest.outputs.version }}"
          branch: chore/ytdlp-${{ steps.latest.outputs.version }}
          delete-branch: true
          title: "Bump yt-dlp to ${{ steps.latest.outputs.version }}"
          body: |
            Automated weekly bump: `${{ steps.current.outputs.version }}` → `${{ steps.latest.outputs.version }}`.

            The live extraction suite passed against this version, so real
            platform extraction was working when this PR was opened.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

      - name: File an issue when live extraction breaks
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const current = '${{ steps.current.outputs.version }}';
            const latest = '${{ steps.latest.outputs.version }}';
            let log = '';
            try {
              log = fs.readFileSync('/tmp/live.log', 'utf8').slice(-4000);
            } catch { log = '(no log captured)'; }

            const title = `yt-dlp canary: live extraction failing (pinned ${current}, latest ${latest})`;

            // Reuse the open issue rather than filing a new one every Monday.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ytdlp-canary',
            });

            const body = [
              `The weekly canary run failed the \`live\` suite.`,
              ``,
              `- Pinned version: \`${current}\``,
              `- Latest released: \`${latest}\``,
              `- Bump attempted: \`${{ steps.bump.outputs.changed == 'true' }}\``,
              `- [Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `A failure here usually means a platform changed its page or API`,
              `and extraction is broken in production. Users should be seeing`,
              `\`EXTRACTOR_OUTDATED\`, not a stack trace — worth confirming.`,
              ``,
              `<details><summary>Tail of the live suite output</summary>`,
              ``,
              '```',
              log,
              '```',
              ``,
              `</details>`,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of this week's run.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ytdlp-canary', 'bug'],
              });
            }
