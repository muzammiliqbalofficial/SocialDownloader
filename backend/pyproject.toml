[project]
name = "socialdownloader-backend"
version = "0.1.0"
description = "Public media extraction API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits real third-party URLs. Excluded by default; run with -m live. Expected to break when platforms change.",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/extractors/*", "app/workers/settings.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"alembic/*" = ["E501"]
